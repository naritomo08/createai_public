<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StableDiffusion画像作成</title>
    <link rel="icon" href="{{ url_for('static', filename='image/favicon.ico') }}" type="image/x-icon">
    <!-- Bootstrap 5のCSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <script src="{{ url_for('static', filename='js/result.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/theme.js') }}" defer></script>
</head>
<body>
    <div style="position: fixed; top: 10px; right: 10px; z-index: 9999;">
        <button id="theme-toggle" class="btn btn-secondary btn-sm">🌙/☀️</button>
    </div>
    {% block content %}
    <!-- 各ページ固有のコンテンツがここに入る -->
    {% endblock %}

    <!-- Bootstrap 5のJavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>
    
    {% block scripts %}
    <!-- 各ページ固有のスクリプトがここに入る -->
    {% endblock %}
</body>
</html>
